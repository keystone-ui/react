name: CI

on:
  push:
    branches:
      - main
  # Unfiltered on purpose. A stacked PR targets another PR's branch, and a
  # `branches: [main]` filter here meant such PRs ran only the deploy
  # workflows -- no lint, no tests, no workerd smoke.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # `bash` sets -o pipefail; the default shell does not, so a failing
    # command on the left of a pipe would leave the step green.
    shell: bash

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      # The Vite builder never type-checked stories (`typescript.check` is a
      # webpack-only option), so this is the first place a story with a
      # wrong prop fails. About five seconds with the TS 7 CLI.
      - name: Type-check stories
        run: pnpm --filter @keystoneui/storybook exec tsc --noEmit -p .

      # Component/block MDX structure, story-vs-demo parity, and whether each
      # block's registry copy still matches its demo. These ran nowhere before,
      # so every rule they enforce was advisory.
      - name: Docs and registry lint
        run: pnpm lint:docs

      # registry.json and apps/docs/public/r/ are committed outputs of
      # `pnpm registry:build`. lint:docs checks registry.json against its
      # sources; this also covers the public JSON that `npx shadcn add`
      # installs, so a demo edit that skipped the rebuild cannot ship stale.
      - name: Registry drift
        run: |
          pnpm registry:build
          # `git diff` ignores untracked files, so a new block's JSON that
          # the build just created would pass unless marked intent-to-add.
          git add --intent-to-add -- registry.json apps/docs/public/r
          git diff --exit-code --stat -- registry.json apps/docs/public/r

  docs-e2e:
    name: Docs Layout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scoped to the package that declares @playwright/test. `.npmrc` only
      # public-hoists *storybook*, so the binary exists in
      # apps/docs/node_modules/.bin and nowhere else -- a bare `pnpm exec`
      # from the repo root exits 254 with "Command playwright not found".
      - name: Install Playwright browser
        run: pnpm --filter @keystoneui/docs exec playwright install --with-deps chromium

      # One production build for both suites below. EXPOSE_TESTING_API=1 keeps
      # Next's testing API in this build so the instant-navigation e2e can hold
      # back un-prefetched content; it is a build-time switch and the deploy
      # workflow never sets it.
      - name: Build docs
        run: pnpm build --filter=@keystoneui/docs
        env:
          EXPOSE_TESTING_API: "1"

      # Chunk budgets, the prerender manifest and the known-paths list are
      # read straight off the build output.
      - name: Built-output invariants
        run: pnpm --filter @keystoneui/docs test:built

      # Every block preview at 375/768/1280, asserting the document never
      # scrolls sideways -- plus a positive control, because "nothing
      # overflows" also passes when no content is wide enough to overflow.
      # Plus the instant-navigation guard for the Cache Components model.
      - name: Layout and navigation invariants
        run: pnpm --filter @keystoneui/docs test:e2e
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"

  # The Playwright job above runs against `next start`. A crash that only
  # happens inside workerd -- the shape of the October 2026 outage, where a
  # Next/OpenNext mismatch threw from the server constructor and every
  # dynamic route was a Cloudflare 1101 for ten days -- cannot fail it, and
  # until now the first time workerd saw a build was after `wrangler deploy`
  # to production. This job builds the real Worker and runs the same smoke
  # checks the deploy workflow runs, before anything merges. It needs no
  # Cloudflare credentials, so it also runs for forks.
  docs-workerd:
    name: Docs on workerd (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm build --filter=@keystoneui/docs^...

      # Same as deploy-docs.yml: the /skills/[skill] route prerenders from
      # these gitignored tarballs.
      - name: Package skill tarballs
        run: pnpm build:skills

      - name: Build Worker
        run: pnpm exec opennextjs-cloudflare build
        working-directory: apps/docs

      # `wrangler deploy` delegates to OpenNext, which populates the
      # prerender cache in the static assets. `wrangler dev` does not, so
      # without this step every prerendered page would render on demand and
      # the run would not resemble production (after Cache Components lands,
      # it would also throw on the read-only cache).
      - name: Populate the static-assets cache
        run: |
          pnpm exec opennextjs-cloudflare populateCache local
          if [ -z "$(ls -A .open-next/assets/cdn-cgi/_next_cache 2>/dev/null)" ]; then
            echo "::error::OpenNext did not populate .open-next/assets/cdn-cgi/_next_cache"
            exit 1
          fi
        working-directory: apps/docs

      # wrangler's local proxy answers 404 before the Worker has loaded, so
      # waiting for the port is not enough; wait for the Ready line.
      - name: Start workerd
        run: |
          pnpm exec wrangler dev --port 8787 > wrangler.log 2>&1 &
          for _ in $(seq 1 90); do
            if grep -q "Ready on" wrangler.log; then
              break
            fi
            sleep 1
          done
          if ! grep -q "Ready on" wrangler.log; then
            echo "::error::wrangler dev did not become ready"
            cat wrangler.log
            exit 1
          fi
        working-directory: apps/docs

      - name: Smoke test on workerd
        run: node scripts/smoke-docs.mjs http://127.0.0.1:8787
        env:
          SMOKE_ATTEMPTS: "10"
          SMOKE_DELAY_MS: "3000"

      - name: Worker log
        if: failure()
        run: cat apps/docs/wrangler.log

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=@keystoneui/react

      - name: Run unit tests
        run: pnpm test --filter=@keystoneui/react

      # @keystoneui/docs holds the registry integrity/link tests and the demo
      # loader tests. Neither ran in CI before, so a broken registry URL or a
      # registry.json that had drifted from apps/docs/public/r/ shipped green.
      - name: Run docs and registry tests
        run: pnpm test --filter=@keystoneui/docs

      # The MCP package had no test script at all, so `turbo run test` skipped
      # it and CI never touched seven tool handlers, a TTL cache, and the
      # config resolver that decides which registry a consumer talks to.
      - name: Run MCP server tests
        run: pnpm test --filter=@keystoneui/mcp

  test-storybook:
    name: Storybook Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/storybook

      - name: Build packages
        run: pnpm build --filter=@keystoneui/storybook^...

      # No separate warm-up run: it doubled the suite's wall time and its
      # `|| true` could hide a failure on the first pass. A cold Vite
      # dependency-optimization reload is handled by the test runner.
      - name: Run Storybook interaction tests
        run: pnpm test --filter=@keystoneui/storybook

  chromatic:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: lint
    # CHROMATIC_PROJECT_TOKEN is a repository secret, which pull requests
    # from forks and from Dependabot do not receive. The actor check is
    # scoped to pull requests on purpose: a Dependabot-driven push to main
    # (`@dependabot merge`) also gets no secrets, and there the job must run
    # and fail loudly rather than skip and leave the baseline stale.
    if: >-
      github.event_name == 'push' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build --filter=@keystoneui/storybook

      - name: Run Chromatic
        uses: chromaui/action@5bcadb5104b09e360e210c54f95a7437c2d82bab # v18.13.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBaseDir: apps/storybook
          storybookBuildDir: apps/storybook/storybook-static
          exitZeroOnChanges: true
          autoAcceptChanges: main
          onlyChanged: true

  skill-evals:
    name: Skill Evals
    runs-on: ubuntu-latest
    needs: lint
    # Costs money per run, and measures the skill rather than the code, so it
    # only runs when the skill or the components it describes actually change.
    # Forked and Dependabot PRs receive no secrets, so the job would fail for
    # a reason the contributor cannot fix -- skip it there and let a
    # maintainer run it. On push the job always runs (the missing-key branch
    # below handles a Dependabot-driven push).
    if: >-
      github.event_name == 'push' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      # paths-filter lists a pull request's changed files through the API.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Changed paths
        id: changed
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            skill:
              - 'skills/**'
              - 'evals/**'
              - 'packages/ui/src/**'
              - '.claude-plugin/**'

      - name: Setup Node.js
        if: steps.changed.outputs.skill == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true

      - name: Run evals
        if: steps.changed.outputs.skill == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set; skipping skill evals."
            exit 0
          fi
          npx -y @anthropic-ai/claude-code@latest plugin eval . \
            --trust-plugin \
            --no-publish \
            --threshold 0.8 \
            --max-cost-usd 15 \
            --json eval-results.json

      - name: Upload eval report
        if: steps.changed.outputs.skill == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: eval-results.json
          if-no-files-found: ignore
