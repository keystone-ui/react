name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      # Component/block MDX structure, story-vs-demo parity, and whether each
      # block's registry copy still matches its demo. These ran nowhere before,
      # so every rule they enforce was advisory.
      - name: Docs and registry lint
        run: pnpm lint:docs

  docs-e2e:
    name: Docs Layout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scoped to the package that declares @playwright/test. `.npmrc` only
      # public-hoists *storybook*, so the binary exists in
      # apps/docs/node_modules/.bin and nowhere else -- a bare `pnpm exec`
      # from the repo root exits 254 with "Command playwright not found".
      - name: Install Playwright browser
        run: pnpm --filter @keystoneui/docs exec playwright install --with-deps chromium

      # Every block preview at 375/768/1280, asserting the document never
      # scrolls sideways -- plus a positive control, because "nothing
      # overflows" also passes when no content is wide enough to overflow.
      - name: Layout invariants
        run: pnpm --filter @keystoneui/docs test:e2e

  # The Playwright job above runs against `next start`. A crash that only
  # happens inside workerd -- the shape of the October 2026 outage, where a
  # Next/OpenNext mismatch threw from the server constructor and every
  # dynamic route was a Cloudflare 1101 for ten days -- cannot fail it, and
  # until now the first time workerd saw a build was after `wrangler deploy`
  # to production. This job builds the real Worker and runs the same smoke
  # checks the deploy workflow runs, before anything merges. It needs no
  # Cloudflare credentials, so it also runs for forks.
  docs-workerd:
    name: Docs on workerd (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm build --filter=@keystoneui/docs^...

      # Same as deploy-docs.yml: the /skills/[skill] route prerenders from
      # these gitignored tarballs.
      - name: Package skill tarballs
        run: pnpm build:skills

      - name: Build Worker
        run: pnpm exec opennextjs-cloudflare build
        working-directory: apps/docs

      # `wrangler deploy` delegates to OpenNext, which populates the
      # prerender cache in the static assets. `wrangler dev` does not, so
      # without this step every prerendered page would render on demand and
      # the run would not resemble production (after Cache Components lands,
      # it would also throw on the read-only cache).
      - name: Populate the static-assets cache
        run: |
          pnpm exec opennextjs-cloudflare populateCache local
          if [ -z "$(ls -A .open-next/assets/cdn-cgi/_next_cache 2>/dev/null)" ]; then
            echo "::error::OpenNext did not populate .open-next/assets/cdn-cgi/_next_cache"
            exit 1
          fi
        working-directory: apps/docs

      # wrangler's local proxy answers 404 before the Worker has loaded, so
      # waiting for the port is not enough; wait for the Ready line.
      - name: Start workerd
        run: |
          pnpm exec wrangler dev --port 8787 > wrangler.log 2>&1 &
          for _ in $(seq 1 90); do
            if grep -q "Ready on" wrangler.log; then
              break
            fi
            sleep 1
          done
          if ! grep -q "Ready on" wrangler.log; then
            echo "::error::wrangler dev did not become ready"
            cat wrangler.log
            exit 1
          fi
        working-directory: apps/docs

      - name: Smoke test on workerd
        run: node scripts/smoke-docs.mjs http://127.0.0.1:8787
        env:
          SMOKE_ATTEMPTS: "10"
          SMOKE_DELAY_MS: "3000"

      - name: Worker log
        if: failure()
        run: cat apps/docs/wrangler.log

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=@keystoneui/react

      - name: Run unit tests
        run: pnpm test --filter=@keystoneui/react

      # @keystoneui/docs holds the registry integrity/link tests and the demo
      # loader tests. Neither ran in CI before, so a broken registry URL or a
      # registry.json that had drifted from apps/docs/public/r/ shipped green.
      - name: Run docs and registry tests
        run: pnpm test --filter=@keystoneui/docs

      # The MCP package had no test script at all, so `turbo run test` skipped
      # it and CI never touched seven tool handlers, a TTL cache, and the
      # config resolver that decides which registry a consumer talks to.
      - name: Run MCP server tests
        run: pnpm test --filter=@keystoneui/mcp

  test-storybook:
    name: Storybook Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/storybook

      - name: Build packages
        run: pnpm build --filter=@keystoneui/storybook^...

      - name: Warm Vite dependency optimization cache
        run: pnpm test --filter=@keystoneui/storybook || true

      - name: Run Storybook interaction tests
        run: pnpm test --filter=@keystoneui/storybook

  chromatic:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build --filter=@keystoneui/storybook

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBaseDir: apps/storybook
          storybookBuildDir: apps/storybook/storybook-static
          exitZeroOnChanges: true
          autoAcceptChanges: main
          onlyChanged: true

  skill-evals:
    name: Skill Evals
    runs-on: ubuntu-latest
    needs: lint
    # Costs money per run, and measures the skill rather than the code, so it
    # only runs when the skill or the components it describes actually change.
    # Forked PRs receive no secrets, so the job would fail for a reason the
    # contributor cannot fix -- skip it there and let a maintainer run it.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changed paths
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            skill:
              - 'skills/**'
              - 'evals/**'
              - 'packages/ui/src/**'
              - '.claude-plugin/**'

      - name: Setup Node.js
        if: steps.changed.outputs.skill == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true

      - name: Run evals
        if: steps.changed.outputs.skill == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set; skipping skill evals." >&2
            exit 0
          fi
          npx -y @anthropic-ai/claude-code@latest plugin eval . \
            --trust-plugin \
            --no-publish \
            --threshold 0.8 \
            --max-cost-usd 15 \
            --json eval-results.json

      - name: Upload eval report
        if: steps.changed.outputs.skill == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
          if-no-files-found: ignore
