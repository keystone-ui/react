name: Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-docs-${{ github.event.pull_request.number || github.ref }}
  # A superseded preview can be dropped; a production deploy cannot, or the
  # version that went live is the one the smoke test never ran against.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # `bash` sets -o pipefail. Without it, `wrangler deploy | tee` below
    # reported tee's exit code, and a rejected deploy left the step green.
    shell: bash

jobs:
  deploy:
    name: Deploy Docs
    # Forks and Dependabot pull requests receive no repository secrets, so
    # this job would fail on authentication instead of deploying. Skip it
    # there; ci.yml's workerd job still builds and smoke-tests the Worker for
    # every PR. On push the job always runs: a Dependabot-driven push to main
    # (`@dependabot merge`) gets no secrets either, and a red deploy is the
    # right outcome, not a green skip that leaves production stale.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'push' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The preview-URL comment below.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm build --filter=@keystoneui/docs^...

      # Produces apps/docs/public/skills/*.tar.gz consumed by the
      # /skills/[skill] route. Gitignored, so must be regenerated each run.
      - name: Package skill tarballs
        run: pnpm build:skills

      - name: Build for Cloudflare
        run: pnpm exec opennextjs-cloudflare build
        working-directory: apps/docs

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm exec wrangler deploy
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # CI's Playwright suite runs against `next start`, not the Workers
      # runtime, so a crash that only happens inside workerd ships green.
      # Prerendered pages are served from assets without invoking Next, so a
      # broken server function is invisible until someone opens a dynamic
      # route. This hits one directly, and the not-found path, right after
      # the deploy. See scripts/smoke-docs.mjs.
      - name: Smoke test production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node scripts/smoke-docs.mjs https://keystoneui.io
        env:
          # An edge can keep serving the previous version for a few seconds
          # after `wrangler deploy` returns; wait so a healthy old version
          # cannot vouch for a broken new one.
          SMOKE_SETTLE_MS: "10000"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          WORKER_NAME="keystoneui-docs-preview-${{ github.event.pull_request.number }}"
          pnpm exec wrangler deploy --name "$WORKER_NAME" 2>&1 | tee deploy-output.txt
          PREVIEW_URL=$(grep -oP 'https://[^\s]+\.workers\.dev' deploy-output.txt | head -1)
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.url
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = `**Docs Preview:** ${{ steps.preview.outputs.url }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('**Docs Preview:**')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Runs after the URL comment on purpose: a failing preview should still
      # leave a link to investigate. Deliberately not gated on the URL output:
      # if the grep above ever stops matching wrangler's output, the script's
      # usage error turns this red instead of the check silently not running.
      - name: Smoke test preview
        if: github.event_name == 'pull_request'
        run: node scripts/smoke-docs.mjs "${{ steps.preview.outputs.url }}"

  cleanup-preview:
    name: Cleanup Preview Worker
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # Resolve the newest 22.x instead of whatever the runner image cached,
          # so Node security releases reach CI the day they ship.
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview Worker
        run: |
          WORKER_NAME="keystoneui-docs-preview-${{ github.event.pull_request.number }}"
          pnpm exec wrangler delete --name "$WORKER_NAME" --force || true
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
