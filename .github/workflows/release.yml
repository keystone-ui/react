name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing: the job proves its identity to the registry with a
  # short-lived OIDC token instead of a long-lived NPM_TOKEN secret. Nothing to
  # expire, and nothing that a tightened 2FA policy can invalidate.
  id-token: write

jobs:
  release:
    name: Release
    if: github.repository_owner == 'keystone-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1 for the OIDC exchange, and Node
      # 22 ships npm 10.x -- which would skip the exchange and fail looking for
      # a token that no longer exists.
      #
      # Pinned to 11, NOT latest. `changeset publish` shells out to
      # `pnpm publish --no-git-checks` (getPublishPlan.mjs), and pnpm 9 forwards
      # that flag straight through to npm, which does not have it. npm <= 11
      # ignores unknown flags; npm 12 made them fatal (EUNKNOWNCONFIG), so
      # `npm@latest` breaks every publish before it reaches the registry.
      # Verified locally against this package: npm 11 packs, npm 12 errors.
      #
      # The other way out is pnpm 12, which consumes the flag itself, but that
      # means moving `packageManager` off 9.15.0 for every developer and CI job
      # at once. Worth doing on its own, not as a rider on a stuck release.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm check

      - name: Build package
        run: pnpm build --filter=@keystoneui/react

      - name: Unit tests
        run: pnpm test --filter=@keystoneui/react

      # `version` must be set explicitly. Without it the action runs a bare
      # `changeset version`, which skips scripts/sync-unreleased.mjs and
      # scripts/rotate-changelog.mjs -- so the docs changelog is never rotated
      # into a dated entry and apps/docs/content/changelog/unreleased.mdx keeps
      # accumulating. `pnpm version-packages` chains all three.
      #
      # `version` also has to run before `publish` for the npm dist-tag to be
      # right. @changesets/cli picks the tag with:
      #
      #   if (preState !== undefined && pkgInfo.publishedState !== "only-pre")
      #     return preState.tag;   // "beta"
      #   return "latest";
      #
      # It tests for the mere *existence* of .changeset/pre.json, not for
      # mode === "pre". `changeset pre exit` only rewrites the file to
      # mode: "exit"; it is `changeset version` that deletes it. So publishing
      # between those two steps still lands on @beta. The action's two-phase
      # flow (version PR, then publish once no changesets remain) keeps that
      # order correct.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        # No NPM_TOKEN / NODE_AUTH_TOKEN on purpose. npm only attempts the OIDC
        # exchange when it finds no token configured for the registry; setting
        # one here makes it authenticate as that token instead and Trusted
        # Publishing never engages.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` chooses a dist-tag per package, and chooses
      # differently for our two. From its own logic:
      #
      #   if (preState !== undefined && pkgInfo.publishedState !== "only-pre")
      #     return preState.tag;   // "beta"
      #   return "latest";
      #
      # @keystoneui/react has a non-prerelease 0.0.0 on npm, so it is not
      # "only-pre" and lands on `beta` -- leaving `latest` pinned to that empty
      # 0.0.0 stub, so a bare `npm i @keystoneui/react` installs nothing.
      # @keystoneui/mcp has only ever published prereleases, so it *is*
      # "only-pre", falls through, and lands on `latest` -- leaving its `beta`
      # tag behind on the previous version. One release, two different holes.
      #
      # While the 1.0 beta train is the only thing we ship, both packages
      # should answer to both tags. Once `changeset pre exit` lands and a real
      # 1.0.0 publishes to `latest` on its own, this step keeps `beta` level
      # with it rather than letting it rot at the last prerelease.
      # Caveat: Trusted Publishing mints a credential for the `npm publish` call
      # itself, so a later `npm dist-tag` in the same job may find no auth. That
      # is unverified until this runs for real, so the step is allowed to fail
      # without failing a release that has already published successfully --
      # the packages are the deliverable, the tags are recoverable by hand. If
      # it does fail, the warnings below name the exact commands to run.
      - name: Sync npm dist-tags
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        env:
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "$PACKAGES" | jq -r '.[] | "\(.name)@\(.version)"' | while read -r spec; do
            for tag in latest beta; do
              echo "npm dist-tag add $spec $tag"
              npm dist-tag add "$spec" "$tag" \
                || echo "::warning::dist-tag $tag not set on $spec — run locally: npm dist-tag add $spec $tag"
            done
          done

      - name: Create GitHub releases
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v7
        env:
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const packages = JSON.parse(process.env.PACKAGES ?? "[]");
            if (!packages.length) {
              core.notice("No packages published, skipping release creation.");
              return;
            }

            const changelogPath = path.join(
              process.env.GITHUB_WORKSPACE,
              "packages/ui/CHANGELOG.md"
            );
            const changelog = fs.existsSync(changelogPath)
              ? fs.readFileSync(changelogPath, "utf8")
              : "";

            function extractSection(version) {
              const lines = changelog.split("\n");
              const start = lines.findIndex(
                (line) => line.trim() === `## ${version}`
              );
              if (start === -1) return null;
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (lines[i].startsWith("## ")) {
                  end = i;
                  break;
                }
              }
              return lines.slice(start + 1, end).join("\n").trim();
            }

            for (const pkg of packages) {
              const tag = `${pkg.name}@${pkg.version}`;
              const section = extractSection(pkg.version);
              const body =
                section ||
                `${tag} published via Changesets. See [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/packages/ui/CHANGELOG.md).`;

              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `${pkg.name} v${pkg.version}`,
                  body,
                  draft: false,
                  prerelease: pkg.version.includes("-"),
                });
                core.info(`Created release for ${tag}`);
              } catch (error) {
                if (error.status === 422) {
                  core.warning(`Release for ${tag} already exists. Skipping.`);
                } else {
                  throw error;
                }
              }
            }
