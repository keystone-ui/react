name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing: the job proves its identity to the registry with a
  # short-lived OIDC token instead of a long-lived NPM_TOKEN secret. Nothing to
  # expire, and nothing that a tightened 2FA policy can invalidate.
  id-token: write

jobs:
  release:
    name: Release
    if: github.repository_owner == 'keystone-ui'
    runs-on: ubuntu-latest
    # Git hooks have no business running here. `.husky/pre-push` is
    # `pnpm check && pnpm build` -- a full monorepo build -- and this job pushes
    # more than once (a tag per published package, plus the version branch), so
    # the hook fires repeatedly and the builds race:
    #
    #   ⨯ Another next build process is already running.
    #
    # That is what broke beta.6 after a successful publish: the first tag push
    # lost the race and the step failed, so @keystoneui/mcp got no git tag and
    # no GitHub release, and `published` never came back true -- skipping the
    # dist-tag sync. The packages were on npm; everything after it was not.
    #
    # The hook is a useful local guard and stays. CI already runs check, build
    # and tests as explicit steps above the publish, so re-running them from
    # inside a git push adds nothing but a race.
    env:
      HUSKY: 0
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1 for the OIDC exchange, and Node
      # 22 ships npm 10.x -- which would skip the exchange and fail looking for
      # a token that no longer exists.
      #
      # Pinned to 11. `changeset publish` shells out to
      # `pnpm publish --no-git-checks` (getPublishPlan.mjs). pnpm 9 forwarded
      # that flag straight through to npm, and npm 12 made unknown flags fatal
      # (EUNKNOWNCONFIG), so `npm@latest` broke every publish. pnpm 10 consumes
      # the flag itself (verified: its `npm publish` argv no longer carries
      # it), so npm 12 should now be safe -- but 11 is what Trusted Publishing
      # was proven on, so move to latest deliberately, not as a side effect.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm check

      - name: Build package
        run: pnpm build --filter=@keystoneui/react

      - name: Unit tests
        run: pnpm test --filter=@keystoneui/react

      # `version` must be set explicitly. Without it the action runs a bare
      # `changeset version`, which skips scripts/sync-unreleased.mjs and
      # scripts/rotate-changelog.mjs -- so the docs changelog is never rotated
      # into a dated entry and apps/docs/content/changelog/unreleased.mdx keeps
      # accumulating. `pnpm version-packages` chains all three.
      #
      # `version` also has to run before `publish` for the npm dist-tag to be
      # right. @changesets/cli picks the tag with:
      #
      #   if (preState != null && publishedState !== "only-pre")
      #     return preState.tag;   // "beta"
      #   return "latest";
      #
      # It tests for the mere *existence* of .changeset/pre.json, not for
      # mode === "pre". `changeset pre exit` only rewrites the file to
      # mode: "exit"; it is `changeset version` that deletes it. So publishing
      # between those two steps still lands on @beta. The action's two-phase
      # flow (version PR, then publish once no changesets remain) keeps that
      # order correct.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          # v2 ignores the GITHUB_TOKEN env var; the token must come in here.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # No NPM_TOKEN / NODE_AUTH_TOKEN on purpose. npm only attempts the OIDC
        # exchange when it finds no token configured for the registry; setting
        # one here makes it authenticate as that token instead and Trusted
        # Publishing never engages.

      # `changeset publish` chooses a dist-tag per package, and chooses
      # differently for our two. From its own logic:
      #
      #   if (preState != null && publishedState !== "only-pre")
      #     return preState.tag;   // "beta"
      #   return "latest";
      #
      # @keystoneui/react has a non-prerelease 0.0.0 on npm, so it is not
      # "only-pre" and lands on `beta` -- leaving `latest` pinned to that empty
      # 0.0.0 stub, so a bare `npm i @keystoneui/react` installs nothing.
      # @keystoneui/mcp has only ever published prereleases, so it *is*
      # "only-pre", falls through, and lands on `latest` -- leaving its `beta`
      # tag behind on the previous version. One release, two different holes.
      #
      # While the 1.0 beta train is the only thing we ship, both packages
      # should answer to both tags. Once `changeset pre exit` lands and a real
      # 1.0.0 publishes to `latest` on its own, `beta` still needs moving level
      # with it rather than rotting at the last prerelease.
      #
      # CI can't do that. A Trusted Publishing credential may publish but not
      # manage dist-tags -- the first real run got
      # `E403 ... This trusted publisher cannot manage dist-tags`. So this step
      # only lists the commands for a maintainer to run with their own npm
      # login. Every published package gets both commands: `dist-tag add` is
      # a no-op when the tag already points there, and the registry can serve
      # stale dist-tags for a while after a publish, so diffing would be
      # unreliable.
      - name: List npm dist-tags to sync by hand
        if: steps.changesets.outputs.published == 'true'
        env:
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          cmds=$(echo "$PACKAGES" | jq -r '.[] | "npm dist-tag add \(.name)@\(.version) latest", "npm dist-tag add \(.name)@\(.version) beta"')
          {
            echo "### npm dist-tags to sync"
            echo
            echo "Trusted Publishing can't manage dist-tags. Run these with your own npm login:"
            echo
            echo '```sh'
            echo "$cmds"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$cmds" | while read -r cmd; do
            echo "::notice title=Sync npm dist-tag::$cmd"
          done

      - name: Create GitHub releases
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v7
        env:
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const packages = JSON.parse(process.env.PACKAGES ?? "[]");
            if (!packages.length) {
              core.notice("No packages published, skipping release creation.");
              return;
            }

            // Resolve each package's OWN changelog. This used to hardcode
            // packages/ui/CHANGELOG.md for every package, so @keystoneui/mcp
            // could only ever get the generic fallback body -- its version is
            // never a heading in @keystoneui/react's changelog.
            const packagesDir = path.join(process.env.GITHUB_WORKSPACE, "packages");
            const changelogByName = new Map();
            for (const dir of fs.readdirSync(packagesDir)) {
              const manifest = path.join(packagesDir, dir, "package.json");
              if (!fs.existsSync(manifest)) continue;
              const { name } = JSON.parse(fs.readFileSync(manifest, "utf8"));
              const changelog = path.join(packagesDir, dir, "CHANGELOG.md");
              if (name && fs.existsSync(changelog)) {
                changelogByName.set(name, fs.readFileSync(changelog, "utf8"));
              }
            }

            function extractSection(changelog, version) {
              const lines = changelog.split("\n");
              const start = lines.findIndex(
                (line) => line.trim() === `## ${version}`
              );
              if (start === -1) return null;
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (lines[i].startsWith("## ")) {
                  end = i;
                  break;
                }
              }
              return lines.slice(start + 1, end).join("\n").trim();
            }

            for (const pkg of packages) {
              const tag = `${pkg.name}@${pkg.version}`;
              const changelog = changelogByName.get(pkg.name);
              const section = changelog
                ? extractSection(changelog, pkg.version)
                : null;
              if (!section) {
                core.warning(`No changelog section for ${tag}; using fallback body.`);
              }
              const body =
                section ||
                `${tag} published via Changesets. See the package's CHANGELOG.md in [${context.repo.owner}/${context.repo.repo}](https://github.com/${context.repo.owner}/${context.repo.repo}).`;

              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `${pkg.name} v${pkg.version}`,
                  body,
                  draft: false,
                  prerelease: pkg.version.includes("-"),
                });
                core.info(`Created release for ${tag}`);
              } catch (error) {
                if (error.status === 422) {
                  core.warning(`Release for ${tag} already exists. Skipping.`);
                } else {
                  throw error;
                }
              }
            }
